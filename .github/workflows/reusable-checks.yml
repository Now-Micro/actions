name: Reusable - Checks for PRs into main

permissions:
    contents: read
    actions: read

on:
    workflow_call:
        inputs:
            # Feature flags
            enable-linting:
                description: "Run CSharpier linting. Defaults to false."
                required: false
                type: string
                default: "false"
            enable-coding-standards:
                description: "Run coding standards checks. Defaults to false."
                required: false
                type: string
                default: "false"
            enable-node-testing:
                description: "Run Node.js tests. Defaults to false."
                required: false
                type: string
                default: "false"
            enable-testing:
                description: "Run tests. Defaults to false."
                required: false
                type: string
                default: "false"
            # Shared
            ci-debug-mode:
                description:
                    "Enable verbose debug logging for discovery steps. Defaults to
                    false."
                required: false
                type: string
                default: "false"
            directory:
                description:
                    "Directory to run the tests in. If this is given, only this
                    directory will be checked for changes and used for the
                    respective checks. If you want to check all changed
                    directories, leave this empty and use the respective pattern
                    inputs to specify which files should trigger checks and how
                    to extract the relevant directories. Defaults to empty
                    (change detection runs across all changed directories)."
                required: false
                type: string
                default: ""
            head-ref:
                description:
                    "The head commit SHA to compare against the base. Defaults to
                    github.sha."
                required: false
                type: string
                default: ""
            # Coding standards
            coding-standards-path-pattern:
                description:
                    "Regex pattern (with capture group) for identifying changed
                    directories to run coding standards against. Default is
                    '^([^/.]+)/'."
                required: false
                type: string
                default: "^([^/.]+)/"
            roslyn-version:
                description:
                    "Optional override for the Microsoft.CodeAnalysis.CSharp package
                    version used by the analyzers. Defaults to empty (bundled
                    version is used)."
                required: false
                type: string
                default: ""
            # Testing - change detection
            optimize-base-ref:
                description:
                    "When true, compares against the SHA of the last successful run on
                    this branch instead of the default branch.  Default is
                    false."
                required: false
                type: string
                default: "false"
            testing-path-pattern:
                description:
                    "Regex pattern (with capture group) for identifying changed
                    directories to run tests against. Defaults to
                    '^([^/]+)/(?:(src|tests?)/.*\\.(cs|csproj|sln|slnx)|.*\\.(s\
                    ln|slnx))$'."
                required: false
                type: string
                default: "^([^/]+)/(?:(src|tests?)/.*\\.(cs|csproj|sln|slnx)|.*\\.(sln|slnx))$"
            transformer:
                description:
                    "sed-style transformer for converting source directories to test
                    directories. Defaults to
                    's#(^|/)src/(.*)$#$1tests/$2.Tests#'."
                required: false
                type: string
                default: "s#(^|/)src/(.*)$#$1tests/$2.Tests#"
            use-original-if-missing:
                description:
                    "Fall back to the original path if the transformed test directory
                    does not exist. Defaults to false."
                required: false
                type: string
                default: "false"
            # Testing - run options
            fail-fast:
                description:
                    "Cancel remaining matrix jobs when any test job fails. Defaults to
                    false."
                required: false
                type: string
                default: "false"
            test-args:
                description: "Additional arguments passed to dotnet test. Defaults to empty."
                required: false
                type: string
                default: ""
            dotnet-version:
                description:
                    ".NET SDK version(s) to use when running tests. Comma-separated for
                    multiple. Defaults to 8.0.x."
                required: false
                type: string
                default: "8.0.x"
            nuget-names:
                description:
                    "Comma-separated names of the NuGet sources to configure when
                    running coding standards and tests jobs. Defaults to 'Now-Micro' (the GitHub Packages
                    feed in the Now-Micro organization).  It should be noted
                    that if you specify multiple urls for the nuget-urls input,
                    you should specify corresponding names here in the same
                    order, otherwise the feeds may not be configured correctly.
                    If you want to use a single feed, you can just specify it
                    here and leave nuget-urls empty to use the default GitHub
                    Packages feed for the Now-Micro organization."
                required: false
                type: string
                default: "Now-Micro"
            nuget-urls:
                description:
                    "Comma-separated list of NuGet feed URLs to configure when running
                    tests. Defaults to
                    'https://nuget.pkg.github.com/{github.repository_owner}/ind\
                    ex.json', so you only need to specify this if you need to
                    add additional feeds or override the default GitHub Packages
                    feed (e.g. your repo has a different owner or you want to
                    use a different feed)."
                required: false
                type: string
                default: ""
            test-project-regex:
                description:
                    "Regex to identify the test project file within the test directory.
                    Defaults to empty (first .csproj found is used)."
                required: false
                type: string
                default: ""
            solution-regex:
                description:
                    "Regex to identify the solution file to use for testing.
                    Defaults to empty (first solution file found, such as .sln or .slnx, is used)."
                required: false
                type: string
                default: ""
            prefer-solution:
                description:
                    "Prefer a .sln file over individual project files when running
                    tests. Defaults to false."
                required: false
                type: string
                default: "false"
            # Node.js testing
            node-test-directory:
                description:
                    "Directory to run Node.js tests in. When empty, changed directories
                    are detected automatically by locating the nearest package.json
                    for each changed file. Defaults to empty."
                required: false
                type: string
                default: ""
            node-testing-path-pattern:
                description:
                    "Regex used to identify changed Node.js files. Defaults to
                    JavaScript, package.json, and npm, pnpm, or yarn lockfiles."
                required: false
                type: string
                default: '\.(m?js|cjs|jsx|ts|tsx)$|(^|/)package\.json$|(^|/)(package-lock\.json|pnpm-lock\.yaml|yarn\.lock)$'
            node-test-command:
                description:
                    "Command to run for each Node.js project directory. Defaults to
                    'npm test'."
                required: false
                type: string
                default: "npm test"
            node-version:
                description: "Node.js version to use for Node.js tests. Defaults to 22.x."
                required: false
                type: string
                default: "22.x"
            node-package-manager:
                description:
                    "Package manager to use for Node.js tests and dependency installation.
                    Defaults to npm. Supported values are npm, pnpm, and yarn."
                required: false
                type: string
                default: "npm"
            node-install-dependencies:
                description: "Install Node.js dependencies before testing. Defaults to true."
                required: false
                type: string
                default: "true"
            node-cache:
                description: "Enable Node.js package-manager dependency caching. Defaults to false."
                required: false
                type: string
                default: "false"
            node-cache-dependency-path:
                description: "Path to the package-manager lockfile used for caching. Defaults to empty."
                required: false
                type: string
                default: ""
            node-fail-fast:
                description:
                    "Cancel remaining Node.js matrix jobs when one fails. Defaults to
                    false."
                required: false
                type: string
                default: "false"
            # Other
            caller-job-name:
                description:
                    "The calling workflow job name prefix used by GitHub for this
                    reusable workflow invocation. Pass the calling job's display
                    name (`jobs.<id>.name`) when it is set; otherwise pass the
                    job id/YAML key (`jobs.<id>`). You can find the exact value
                    in the GitHub Actions UI/API job name. Required when
                    optimize-base-ref is true. GitHub prefixes reusable workflow
                    job names with this value (e.g. 'checks / test-setup'), so
                    it must match for the last-success lookup to work correctly.
                    Defaults to empty."
                required: false
                type: string
                default: ""
            overridden-changed-files:
                description:
                    "JSON array of file paths to treat as changed. When set, skips git
                    change detection entirely and uses these paths for pattern
                    matching. Intended for testing and demo scenarios. Defaults
                    to empty (git change detection is used)."
                required: false
                type: string
                default: ""
            workflow-name:
                description:
                    "Filename of this checks workflow. Used when looking up the last
                    successful run for base-ref optimization. If omitted, the
                    workflow will not be able to optimize the base ref and will
                    always compare against the default branch. Defaults to empty
                    (base-ref optimization is disabled)."
                required: false
                type: string
                default: ""
        secrets:
            token-github-packages:
                description:
                    "PAT with read:packages permission for restoring NuGet packages
                    from GitHub Packages."
                required: false

jobs:
    lint:
        runs-on: ubuntu-22.04
        if: ${{ inputs['enable-linting'] == 'true' }}
        steps:
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  fetch-depth: 0

            - name: CSharpier Linting
              uses: Now-Micro/actions/dotnet/lint@v1

    coding-standards-setup:
        runs-on: ubuntu-22.04
        if: ${{ inputs['enable-coding-standards'] == 'true' }}
        outputs:
            directories_to_check: ${{ steps.resolve-directories.outputs.directories_to_check }}
        steps:
            - name: Validate token-github-packages secret
              shell: bash
              env:
                  TOKEN: ${{ secrets['token-github-packages'] }}
              run: |
                  if [ -z "$TOKEN" ]; then
                    echo "::error::The 'token-github-packages' secret is required when 'enable-coding-standards' or 'enable-testing' is true, but it was not provided or is empty." >&2
                    exit 1
                  fi
                  echo "✅ token-github-packages secret is present."

            - name: Check out code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  fetch-depth: 0

            - name: Determine coding standards mode
              id: mode
              shell: bash
              env:
                  DIRECTORY: ${{ inputs.directory }}
              run: |
                  echo "Input directory: $DIRECTORY"
                  if [ -n "$DIRECTORY" ]; then
                    echo "mode=directory" >> "$GITHUB_OUTPUT"
                    echo "directory=$DIRECTORY" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  echo "mode=changes" >> "$GITHUB_OUTPUT"

            - name: Get Changed Files
              if: ${{ steps.mode.outputs.mode == 'changes' &&
                  inputs['overridden-changed-files'] == '' }}
              id: changed-files
              uses: Now-Micro/actions/get-changed-files@v1
              with:
                  head-ref: ${{ inputs['head-ref'] || github.sha }}
                  base-ref: ${{ github.event.repository.default_branch }}

            - name: Get Unique Root Directories
              if: ${{ steps.mode.outputs.mode == 'changes' }}
              id: unique-dirs
              uses: Now-Micro/actions/get-unique-root-directories@v1
              with:
                  paths: ${{ inputs['overridden-changed-files'] ||
                      steps.changed-files.outputs.changed_files }}
                  pattern: ${{ inputs['coding-standards-path-pattern'] }}
                  debug-mode: ${{ inputs['ci-debug-mode'] }}

            - name: Resolve coding standards directories
              id: resolve-directories
              shell: bash
              env:
                  MODE: ${{ steps.mode.outputs.mode }}
                  DIRECTORY: ${{ steps.mode.outputs.directory }}
                  CHANGED_DIRS_JSON:
                      ${{ steps.unique-dirs.outputs.unique_root_directories || '[]'
                      }}
              run: |
                  case "$MODE" in
                    directory)
                      echo "directories_to_check=$(jq -nc --arg dir "$DIRECTORY" '[ $dir ]')" >> "$GITHUB_OUTPUT"
                      ;;
                    changes)
                      echo "directories_to_check=$CHANGED_DIRS_JSON" >> "$GITHUB_OUTPUT"
                      ;;
                    *)
                      echo "directories_to_check=[]" >> "$GITHUB_OUTPUT"
                      ;;
                  esac

    code-standards:
        runs-on: ubuntu-22.04
        needs: [coding-standards-setup]
        if: ${{ inputs['enable-coding-standards'] == 'true' &&
            needs.coding-standards-setup.outputs.directories_to_check != '[]' }}
        strategy:
            fail-fast: false
            matrix:
                directory: ${{
                    fromJson(needs.coding-standards-setup.outputs.directories_to_check)
                    }}
        steps:
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  fetch-depth: 0

            - name: Run Code Standards
              uses: Now-Micro/actions/dotnet/coding-standards@v1
              with:
                  directory: ${{ matrix.directory }}
                  roslyn-version: ${{ inputs['roslyn-version'] }}
                  nuget-names: ${{ inputs['nuget-names'] }}
                  nuget-passwords: ${{ secrets['token-github-packages'] }}
                  nuget-urls: ${{ inputs['nuget-urls'] || format('https://nuget.pkg.github.com/{0}/index.json', github.repository_owner) }}
                  nuget-usernames: ${{ github.actor }}

    node-test-setup:
        uses: ./.github/workflows/reusable-resolve-test-directories.yml
        if: ${{ inputs['enable-node-testing'] == 'true' }}
        with:
            directory: ${{ inputs['node-test-directory'] }}
            path-pattern: ${{ inputs['node-testing-path-pattern'] }}
            project-file-name: "package.json"
            head-ref: ${{ inputs['head-ref'] }}
            optimize-base-ref: ${{ inputs['optimize-base-ref'] }}
            workflow-name: ${{ inputs['workflow-name'] }}
            caller-job-name: ${{ inputs['caller-job-name'] }}
            setup-job-key: "node-test-setup"
            run-job-key: "node-test"
            overridden-changed-files: ${{ inputs['overridden-changed-files'] }}
            ci-debug-mode: ${{ inputs['ci-debug-mode'] }}
            require-token-github-packages: "false"
        secrets:
            token-github-packages: ${{ secrets['token-github-packages'] }}

    node-test:
        runs-on: ubuntu-22.04
        needs: [node-test-setup]
        if: ${{ inputs['enable-node-testing'] == 'true' &&
            needs.node-test-setup.outputs.directories_to_test != '[]' }}
        strategy:
            fail-fast: ${{ inputs['node-fail-fast'] == 'true' }}
            matrix:
                directory: ${{ fromJson(needs.node-test-setup.outputs.directories_to_test) }}
        steps:
            - name: Check out code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  fetch-depth: 0

            - name: Set up Node.js and install dependencies
              uses: Now-Micro/actions/setup-node@v1
              with:
                  cache: ${{ inputs['node-cache'] }}
                  cache-dependency-path: ${{ inputs['node-cache-dependency-path'] }}
                  install-dependencies: ${{ inputs['node-install-dependencies'] }}
                  install-dependencies-directory: ${{ matrix.directory }}
                  node-version: ${{ inputs['node-version'] }}
                  package-manager: ${{ inputs['node-package-manager'] }}

            - name: Run Node.js tests
              shell: bash
              working-directory: ${{ matrix.directory }}
              env:
                  NODE_PACKAGE_MANAGER: ${{ inputs['node-package-manager'] }}
                  NODE_TEST_COMMAND: ${{ inputs['node-test-command'] }}
              run: |
                  if [ "$NODE_TEST_COMMAND" = "npm test" ]; then
                      "$NODE_PACKAGE_MANAGER" test
                  else
                      $NODE_TEST_COMMAND
                  fi

    test-setup:
        uses: ./.github/workflows/reusable-resolve-test-directories.yml
        if: ${{ inputs['enable-testing'] == 'true' }}
        with:
            directory: ${{ inputs.directory }}
            path-pattern: ${{ inputs['testing-path-pattern'] }}
            project-file-name: ".csproj"
            transformer: ${{ inputs.transformer }}
            use-original-if-missing: ${{ inputs['use-original-if-missing'] }}
            head-ref: ${{ inputs['head-ref'] }}
            optimize-base-ref: ${{ inputs['optimize-base-ref'] }}
            workflow-name: ${{ inputs['workflow-name'] }}
            caller-job-name: ${{ inputs['caller-job-name'] }}
            setup-job-key: "test-setup"
            run-job-key: "test"
            overridden-changed-files: ${{ inputs['overridden-changed-files'] }}
            ci-debug-mode: ${{ inputs['ci-debug-mode'] }}
            require-token-github-packages: "true"
        secrets:
            token-github-packages: ${{ secrets['token-github-packages'] }}

    test:
        runs-on: ubuntu-22.04
        needs: [test-setup]
        if: ${{ inputs['enable-testing'] == 'true' &&
            needs.test-setup.outputs.directories_to_test != '[]' }}
        strategy:
            fail-fast: ${{ inputs['fail-fast'] == 'true' }}
            matrix:
                directory: ${{ fromJson(needs.test-setup.outputs.directories_to_test) }}
        steps:
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  fetch-depth: 0

            - name: Configure Github NuGet source
              uses: Now-Micro/actions/nuget/configure-sources@v1
              with:
                  names: ${{ inputs['nuget-names'] }}
                  passwords: ${{ secrets['token-github-packages'] }}
                  urls: ${{ inputs['nuget-urls'] || format('https://nuget.pkg.github.com/{0}/index.json', github.repository_owner) }}
                  usernames: ${{ github.actor }}

            - name: Run tests
              uses: Now-Micro/actions/dotnet/test@v1
              with:
                  args: ${{ inputs['test-args'] }}
                  directory: ${{ matrix.directory }}
                  dotnet-version: ${{ inputs['dotnet-version'] }}
                  project-regex: ${{ inputs['test-project-regex'] }}
                  prefer-solution: ${{ inputs['prefer-solution'] }}
                  solution-regex: ${{ inputs['solution-regex'] }}

            - name: Build safe artifact name
              id: artifact-name
              if: ${{ always() }}
              shell: bash
              run: |
                  safe_dir=$(echo "${{ matrix.directory }}" | sed 's#[\/:*?"<>|]#-#g')
                  echo "value=Test Results - ${safe_dir}" >> "$GITHUB_OUTPUT"

            - name: Upload Test Results
              if: ${{ always() }}
              continue-on-error: true
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: ${{ steps.artifact-name.outputs.value }}
                  path: test-results/**
