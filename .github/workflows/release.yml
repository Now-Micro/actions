name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to release (identifier)"
        required: true
        type: string
        default: "v1"
      name:
        description: "Release name (defaults to tag)"
        required: false
        type: string
      body:
        description: "Release notes body (optional; ignored if generate-release-notes=true)"
        required: false
        type: string
        default: "Initial Release"
      target:
        description: "Target commitish (branch or SHA). Ignored if tag already exists."
        required: false
        type: string
        default: main
      draft:
        description: "Create as draft"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Mark as prerelease"
        required: false
        type: boolean
        default: false
      generate-release-notes:
        description: "Auto-generate release notes"
        required: false
        type: boolean
        default: true
      overwrite-strategy:
        description: "How to handle an existing release for the same tag"
        required: false
        type: choice
        options:
          - none
          - rename
          - delete
        default: rename
      skip-tests:
        description: "Skip running tests"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  resolve-inputs:
    name: Resolve inputs
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      name: ${{ steps.resolve.outputs.name }}
      body: ${{ steps.resolve.outputs.body }}
      target: ${{ steps.resolve.outputs.target }}
      draft: ${{ steps.resolve.outputs.draft }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      generate-release-notes: ${{ steps.resolve.outputs.generate-release-notes }}
      overwrite-strategy: ${{ steps.resolve.outputs.overwrite-strategy }}
      skip-tests: ${{ steps.resolve.outputs.skip-tests }}
    steps:
      # workflow_dispatch inputs aren't available on push events, so a push to main
      # resolves to the same values as the workflow_dispatch defaults shown in the UI.
      - name: Resolve effective inputs
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "name=${{ inputs.name }}" >> "$GITHUB_OUTPUT"
            body_delim="BODY_EOF_$(date +%s%N)"
            { echo "body<<${body_delim}"; echo "${{ inputs.body }}"; echo "${body_delim}"; } >> "$GITHUB_OUTPUT"
            echo "target=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
            echo "draft=${{ inputs.draft }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=${{ inputs.prerelease }}" >> "$GITHUB_OUTPUT"
            echo "generate-release-notes=${{ inputs.generate-release-notes }}" >> "$GITHUB_OUTPUT"
            echo "overwrite-strategy=${{ inputs.overwrite-strategy }}" >> "$GITHUB_OUTPUT"
            echo "skip-tests=${{ inputs['skip-tests'] }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v1" >> "$GITHUB_OUTPUT"
            echo "name=" >> "$GITHUB_OUTPUT"
            { echo "body<<EOF"; echo "Initial Release"; echo "EOF"; } >> "$GITHUB_OUTPUT"
            echo "target=main" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "generate-release-notes=true" >> "$GITHUB_OUTPUT"
            echo "overwrite-strategy=rename" >> "$GITHUB_OUTPUT"
            echo "skip-tests=true" >> "$GITHUB_OUTPUT"
          fi

  run-node-tests:
    name: Run Node tests
    needs: [resolve-inputs]
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Run Node tests
        if: ${{ !fromJson(needs.resolve-inputs.outputs.skip-tests) }}
        uses: ./.github/actions/run-node-tests
      - name: Skipping Node tests
        if: ${{ fromJson(needs.resolve-inputs.outputs.skip-tests) }}
        run: echo "skip-tests input=true; skipping Node tests"

  run-workflow-tests:
    name: Run workflow tests
    needs: [resolve-inputs]
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Run demo composites
        if: ${{ !fromJson(needs.resolve-inputs.outputs.skip-tests) }}
        uses: ./.github/actions/run-demo-workflows
        with:
          github-token: ${{ secrets.TOKEN_GITHUB_PACKAGES }}
          github-release-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Skipping demo workflows
        if: ${{ fromJson(needs.resolve-inputs.outputs.skip-tests) }}
        run: echo "skip-tests input=true; skipping demo workflows"

  publish:
    name: Publish release
    needs: [resolve-inputs, run-node-tests, run-workflow-tests]
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release_out.outputs.release_id }}
      html_url: ${{ steps.release_out.outputs.html_url }}
      upload_url: ${{ steps.release_out.outputs.upload_url }}

    steps:
      - name: Check for existing release by tag
        id: get
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = `${{ needs.resolve-inputs.outputs.tag }}`;
            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              core.setOutput('exists', 'true');
              core.setOutput('id', String(data.id));
              core.setOutput('html_url', data.html_url || '');
              core.setOutput('upload_url', data.upload_url || '');
            } catch (e) {
              if (e.status === 404) {
                core.info(`No existing release for tag ${tag}`);
                core.setOutput('exists', 'false');
              } else {
                throw e;
              }
            }

      - name: Rename existing release (if requested)
        id: rename_release
        if: ${{ steps.get.outputs.exists == 'true' && needs.resolve-inputs.outputs.overwrite-strategy == 'rename' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Instead of deleting the existing release, rename it and move its tag to a backup name
            const release_id = Number(`${{ steps.get.outputs.id }}`);
            const currentTag = `${{ needs.resolve-inputs.outputs.tag }}`;
            const now = new Date().toISOString().replace(/[:.]/g, '-');
            const backupTag = `${currentTag}-backup-${now}`;

            // Read the existing release to get current name and target
            const { data: existing } = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id,
            });
            const newName = `${existing.name || existing.tag_name || currentTag} (renamed ${now})`;

            // Attempt to find the existing tag ref's SHA so we can create a backup tag pointing
            // at the same commit. Fallback to the release's target_commitish if the tag ref
            // isn't available as a git ref.
            let originalSha = undefined;
            try {
              const refRes = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${currentTag}`,
              });
              originalSha = refRes.data.object.sha;
              core.info(`Found tag ref refs/tags/${currentTag} -> ${originalSha}`);
            } catch (e) {
              core.info(`Tag ref refs/tags/${currentTag} not found as a git ref: ${e.message}; falling back to release.target_commitish`);
              originalSha = existing.target_commitish || undefined;
            } 

            if (originalSha) {
              try {
                await github.rest.git.createRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `refs/tags/${backupTag}`,
                  sha: originalSha,
                });
                core.info(`Created backup tag refs/tags/${backupTag} -> ${originalSha}`);
              } catch (e) {
                core.info(`Failed to create backup tag refs/tags/${backupTag}: ${e.message}`);
              }
            } else {
              core.info(`Could not determine SHA for original tag ${currentTag}; skipping creation of backup tag ref.`);
            }

            // Expose the determined original SHA as a step output so subsequent steps
            // (notably the create release step) can reuse the same commit if desired.
            core.setOutput('original_sha', originalSha || '');

            // Update the release to point to the backup tag name and update its display name
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id,
              tag_name: backupTag,
              name: newName
            });

            core.info(`Renamed release id ${release_id} -> name='${newName}', tag='${backupTag}'`);

      - name: Delete existing release (if requested)
        if: ${{ steps.get.outputs.exists == 'true' && needs.resolve-inputs.outputs.overwrite-strategy == 'delete' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const release_id = Number(`${{ steps.get.outputs.id }}`);
            await github.rest.repos.deleteRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id,
            });
            core.info(`Deleted existing release id ${release_id}`);

      - name: Delete tag for existing release (if requested)
        if: ${{ steps.get.outputs.exists == 'true' && needs.resolve-inputs.outputs.overwrite-strategy != 'none' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          TAG_NAME: ${{ needs.resolve-inputs.outputs.tag }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = process.env.TAG_NAME;
            if (!tag) { core.info('No tag provided to delete'); return; }
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
              core.info(`Deleted ref refs/tags/${tag}`);
            } catch (e) {
              if (e.status === 404 || e.status === 422 || e.status === 403) {
                core.info(`Could not delete ref refs/tags/${tag} (may not exist or is protected): ${e.message}`);
              } else {
                throw e;
              }
            }

      - name: Use existing release (no overwrite requested)
        id: create_or_reuse
        if: ${{ steps.get.outputs.exists == 'true' && needs.resolve-inputs.outputs.overwrite-strategy == 'none' }}
        run: |
          echo "release_id=${{ steps.get.outputs.id }}" >> $GITHUB_OUTPUT
          echo "html_url=${{ steps.get.outputs.html_url }}" >> $GITHUB_OUTPUT
          echo "upload_url=${{ steps.get.outputs.upload_url }}" >> $GITHUB_OUTPUT

      - name: Create release
        id: create
        if: ${{ steps.get.outputs.exists != 'true' || needs.resolve-inputs.outputs.overwrite-strategy != 'none' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          INPUT_TAG: ${{ needs.resolve-inputs.outputs.tag }}
          INPUT_NAME: ${{ needs.resolve-inputs.outputs.name }}
          INPUT_BODY: ${{ needs.resolve-inputs.outputs.body }}
          INPUT_TARGET: ${{ needs.resolve-inputs.outputs.target }}
          INPUT_DRAFT: ${{ needs.resolve-inputs.outputs.draft }}
          INPUT_PRERELEASE: ${{ needs.resolve-inputs.outputs.prerelease }}
          INPUT_GENERATE_NOTES: ${{ needs.resolve-inputs.outputs.generate-release-notes }}
          EVENT_NAME: ${{ github.event_name }}
          ORIGINAL_SHA: ${{ steps.rename_release.outputs.original_sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = process.env.INPUT_TAG;
            const name = (process.env.INPUT_NAME && process.env.INPUT_NAME.trim()) || tag;
            const body = (process.env.INPUT_BODY && process.env.INPUT_BODY.length ? process.env.INPUT_BODY : undefined);
            const target = (process.env.INPUT_TARGET && process.env.INPUT_TARGET.trim()) || undefined;
            const originalSha = (process.env.ORIGINAL_SHA && process.env.ORIGINAL_SHA.trim()) || undefined;
            const draft = /^true$/i.test(process.env.INPUT_DRAFT || '');
            const prerelease = /^true$/i.test(process.env.INPUT_PRERELEASE || '');
            const generate_release_notes = /^true$/i.test(process.env.INPUT_GENERATE_NOTES || '');

            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name,
              draft,
              prerelease,
              generate_release_notes,
            };
            if (body && !generate_release_notes) params.body = body;
            // Prefer explicit INPUT_TARGET if provided, otherwise fall back to the original SHA
            // discovered when renaming the previous release (if any).
            if (target) {
              params.target_commitish = target;
            } else if (originalSha) {
              params.target_commitish = originalSha;
            }

            const { data } = await github.rest.repos.createRelease(params);

            // Tag the release body with the triggering event so cleanup can identify
            // workflow_dispatch releases and exclude them from deletion consideration.
            const eventMarker = `<!-- release-event: ${process.env.EVENT_NAME || 'unknown'} -->`;
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: data.id,
              body: `${data.body || ''}\n\n${eventMarker}`,
            });

            core.setOutput('release_id', String(data.id));
            core.setOutput('html_url', data.html_url || '');
            core.setOutput('upload_url', data.upload_url || '');

      - name: Consolidate outputs
        id: release_out
        shell: bash
        env:
          CREATE_RELEASE_ID: ${{ steps.create.outputs.release_id }}
          CREATE_HTML_URL: ${{ steps.create.outputs.html_url }}
          CREATE_UPLOAD_URL: ${{ steps.create.outputs.upload_url }}
          REUSE_RELEASE_ID: ${{ steps.create_or_reuse.outputs.release_id }}
          REUSE_HTML_URL: ${{ steps.create_or_reuse.outputs.html_url }}
          REUSE_UPLOAD_URL: ${{ steps.create_or_reuse.outputs.upload_url }}
        run: |
          release_id="${CREATE_RELEASE_ID:-$REUSE_RELEASE_ID}"
          html_url="${CREATE_HTML_URL:-$REUSE_HTML_URL}"
          upload_url="${CREATE_UPLOAD_URL:-$REUSE_UPLOAD_URL}"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "html_url=$html_url" >> "$GITHUB_OUTPUT"
          echo "upload_url=$upload_url" >> "$GITHUB_OUTPUT"

      - name: Delete oldest release created by this workflow
        id: cleanup
        if: ${{ steps.release_out.outputs.release_id != '' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CURRENT_RELEASE_ID: ${{ steps.release_out.outputs.release_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const MIN_RELEASES_TO_KEEP = 25;
            const currentReleaseId = Number(process.env.CURRENT_RELEASE_ID);
            core.info(`🔍 Cleanup starting. Current release id=${currentReleaseId}`);

            core.info('🔍 Fetching all releases (paginated)...');
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            core.info(`🔍 Fetched ${releases.length} total release(s) from the repo.`);

            // Only consider releases this workflow created (via GITHUB_TOKEN), covering both
            // workflow_dispatch and push-triggered runs; manually-created releases are left alone.
            const isFromWorkflowDispatch = r => typeof r.body === 'string' && r.body.includes('release-event: workflow_dispatch');
            const workflowReleases = releases.filter(r => r.author?.login === 'github-actions[bot]');
            core.info(`🔍 Found ${workflowReleases.length} release(s) authored by github-actions[bot]:`);
            for (const r of workflowReleases) {
              const tags = [
                r.id === currentReleaseId ? 'current' : null,
                isFromWorkflowDispatch(r) ? 'workflow_dispatch - excluded from deletion' : null,
              ].filter(Boolean).join(', ');
              core.info(`🔍   - id=${r.id} tag=${r.tag_name} created_at=${r.created_at}${tags ? ` (${tags})` : ''}`);
            }

            if (workflowReleases.length < MIN_RELEASES_TO_KEEP) {
              core.info(`🔍 Only ${workflowReleases.length} workflow-created release(s) exist, which is below the minimum of ${MIN_RELEASES_TO_KEEP}. Skipping deletion.`);
              return;
            }
            core.info(`🔍 ${workflowReleases.length} workflow-created release(s) meet/exceed the minimum of ${MIN_RELEASES_TO_KEEP}. Proceeding to find the oldest one to delete.`);

            const candidates = workflowReleases.filter(r => r.id !== currentReleaseId && !isFromWorkflowDispatch(r));
            if (candidates.length === 0) {
              core.info('🔍 No prior workflow-created releases eligible for deletion (excluding the current release and any workflow_dispatch releases).');
              return;
            }

            const oldest = candidates.reduce((a, b) =>
              new Date(a.created_at) < new Date(b.created_at) ? a : b
            );
            core.info(`🔍 Oldest candidate selected for deletion: id=${oldest.id} tag=${oldest.tag_name} name='${oldest.name || ''}' created_at=${oldest.created_at}`);

            core.info(`🔍 Deleting release id=${oldest.id}...`);
            await github.rest.repos.deleteRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: oldest.id,
            });
            core.info(`✅ Deleted release id=${oldest.id} tag=${oldest.tag_name}`);

            core.info(`🔍 Deleting tag ref refs/tags/${oldest.tag_name}...`);
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${oldest.tag_name}`,
              });
              core.info(`✅ Deleted tag ref refs/tags/${oldest.tag_name}`);
            } catch (e) {
              core.info(`⚠️ Could not delete tag ref refs/tags/${oldest.tag_name} (may not exist or is protected): ${e.message}`);
            }

            core.info('🔍 Cleanup complete.');

      - name: Summary
        if: always()
        run: |
          echo "Release tag: ${{ needs.resolve-inputs.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "Overwrite strategy: ${{ needs.resolve-inputs.outputs.overwrite-strategy }}" >> $GITHUB_STEP_SUMMARY
          echo "Release URL: ${{ steps.release_out.outputs.html_url }}" >> $GITHUB_STEP_SUMMARY
