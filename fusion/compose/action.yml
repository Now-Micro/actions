name: "Compose Fusion Gateway"
description: "Restores Fusion subgraph assets from GitHub releases and composes a gateway .fgp file."

inputs:
  debug-mode:
    description: "Enable verbose logging."
    required: false
    default: "false"
  dotnet-tools-manifest-path:
    description: "Path to the dotnet local tools manifest file."
    required: false
    default: ".config/dotnet-tools.json"
  dotnet-version:
    description: ".NET SDK version to install before running compose."
    required: false
    default: "8.0.x"
  gh-token:
    description: "GitHub token used by gh release download when restoring subgraph artifacts."
    required: false
    default: ""
  input-directory:
    description: "Directory to scan recursively for subgraph files used during composition."
    required: false
    default: "artifacts/subgraphs"
  manifest-path:
    description: "Path to the gateway release manifest JSON file."
    required: false
    default: ""
  subgraph-artifacts-json:
    description: "Inline JSON manifest for subgraph artifact restore. When set, this overrides manifest-path."
    required: false
    default: ""
  output-directory:
    description: "Directory where downloaded subgraph assets are staged. Empty means use manifest.outputDirectory."
    required: false
    default: ""
  output-file:
    description: "Destination path for the composed gateway .fgp file."
    required: true
  nuget-source-names:
    description: "Comma-separated NuGet source names passed to nuget/configure-sources."
    required: false
    default: "Now-Micro, Trafera-LLC"
  nuget-source-passwords:
    description: "Comma-separated NuGet source passwords. Defaults to gh-token when empty."
    required: false
    default: ""
  nuget-source-urls:
    description: "Comma-separated NuGet source URLs passed to nuget/configure-sources."
    required: false
    default: "https://nuget.pkg.github.com/Now-Micro/index.json, https://nuget.pkg.github.com/trafera-LLC/index.json"
  nuget-source-usernames:
    description: "Comma-separated NuGet source usernames. Defaults to github.actor when empty."
    required: false
    default: ""
  run-dotnet-tool-restore:
    description: "When true, run dotnet tool restore before composing."
    required: false
    default: "true"
  subgraph-file-extension:
    description: "Subgraph file extension to include when scanning input-directory."
    required: false
    default: ".fsp"
  verify-fusion-command:
    description: "When true, verify the local Fusion tool can run by invoking help."
    required: false
    default: "true"
  working-directory:
    description: "Base directory used to resolve relative input/output paths. Defaults to the current working directory."
    required: false
    default: ""

outputs:
  input-directory:
    description: "Resolved absolute input directory used for composition."
    value: ${{ steps.compose.outputs.input-directory }}
  output-file:
    description: "Resolved absolute output .fgp path."
    value: ${{ steps.compose.outputs.output-file }}
  subgraph-count:
    description: "Number of subgraph files composed into the gateway output."
    value: ${{ steps.compose.outputs.subgraph-count }}

runs:
  using: "composite"
  steps:
    - name: Install .NET SDK for Fusion compose
      uses: Now-Micro/actions/dotnet/install@v1
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Configure GitHub NuGet sources
      uses: Now-Micro/actions/nuget/configure-sources@v1
      with:
        debug-mode: ${{ inputs.debug-mode }}
        names: ${{ inputs.nuget-source-names }}
        passwords: ${{ inputs.nuget-source-passwords != '' && inputs.nuget-source-passwords || inputs.gh-token }}
        urls: ${{ inputs.nuget-source-urls }}
        usernames: ${{ inputs.nuget-source-usernames != '' && inputs.nuget-source-usernames || github.actor }}

    - name: Compose Fusion gateway
      id: compose
      shell: bash
      run: node "$GITHUB_ACTION_PATH/compose.js"
      env:
        INPUT_DEBUG_MODE: ${{ inputs.debug-mode }}
        INPUT_DOTNET_TOOLS_MANIFEST_PATH: ${{ inputs.dotnet-tools-manifest-path }}
        INPUT_GH_TOKEN: ${{ inputs.gh-token }}
        INPUT_INPUT_DIRECTORY: ${{ inputs.input-directory }}
        INPUT_MANIFEST_PATH: ${{ inputs.manifest-path }}
        INPUT_SUBGRAPH_ARTIFACTS_JSON: ${{ inputs.subgraph-artifacts-json }}
        INPUT_OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
        INPUT_OUTPUT_FILE: ${{ inputs.output-file }}
        INPUT_RUN_DOTNET_TOOL_RESTORE: ${{ inputs.run-dotnet-tool-restore }}
        INPUT_SUBGRAPH_FILE_EXTENSION: ${{ inputs.subgraph-file-extension }}
        INPUT_VERIFY_FUSION_COMMAND: ${{ inputs.verify-fusion-command }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
